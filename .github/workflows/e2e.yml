name: E2E smoke tests

# Runs the cheap E2E tests (API health + landing page render) on every push and PR.
# The search test is intentionally excluded: on a cache miss it runs the live
# pipeline (4 Claude API calls = real cost), so it is run manually rather than
# on every push.

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run cheap E2E tests (no paid search)
        run: npx playwright test -g "API health|landing page|search is open"
