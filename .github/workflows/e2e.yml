name: E2E smoke tests

# Runs the cheap E2E tests (API health + auth-gate render) on every push and PR.
# The full "register + search" test is intentionally excluded: it hits the live
# pipeline (~3 Claude API calls = real cost) and writes a user to the prod DB,
# so it is run manually rather than on every push.

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run cheap E2E tests (no paid search)
        run: npx playwright test -g "API health|auth gate"
